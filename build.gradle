plugins {
	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.moddev' version '2.0.141'
	id 'idea'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(21)
	withSourcesJar()
}

repositories {
	mavenCentral()
}

sourceSets.main.java {
	// These mixins target Fabric Renderer API internals, which do not exist on
	// native NeoForge. Sodium support is handled by the existing pseudo mixins.
	exclude 'net/wurstclient/mixin/indigo/**'
}

dependencies {
	// Minecraft references javax.annotation.concurrent.Immutable through BlockPos.
	implementation 'com.google.code.findbugs:jsr305:3.0.2'
	compileOnly 'org.jetbrains:annotations:24.1.0'
}

neoForge {
	version = project.neo_version
	validateAccessTransformers = false

	parchment {
		mappingsVersion = project.parchment_mappings_version
		minecraftVersion = project.parchment_minecraft_version
	}

	runs {
		client {
			client()
			systemProperty 'wurst.neoforge.dev', 'true'
			if(System.getenv('GENERIC_MC_CLIENT_QUICKPLAY_MULTIPLAYER')) {
				programArgument '--quickPlayMultiplayer'
				programArgument System.getenv('GENERIC_MC_CLIENT_QUICKPLAY_MULTIPLAYER')
			}
		}

		server {
			server()
			programArgument '--nogui'
		}

		configureEach {
			gameDirectory.set(file(providers.gradleProperty('genericMinecraftDevHome')
				.orElse(providers.environmentVariable('GENERIC_MINECRAFT_DEV_HOME'))
				.orElse("${System.getProperty('user.home')}/GenericMinecraftDevServer")
				.get()))
			logLevel = org.slf4j.event.Level.DEBUG
		}
	}

	mods {
		wurst {
			sourceSet(sourceSets.main)
		}
	}
}

processResources {
	def modVersion = project.version.startsWith('v')
		? project.version.substring(1) : project.version
	def replaceProperties = [
		minecraft_version_range: project.minecraft_version_range,
		neo_version            : project.neo_version,
		loader_version_range   : project.loader_version_range,
		mod_id                 : project.mod_id,
		mod_name               : project.mod_name,
		mod_license            : project.mod_license,
		mod_version            : modVersion,
		mod_authors            : project.mod_authors,
		mod_description        : project.mod_description
	]

	inputs.properties replaceProperties
	filesMatching('META-INF/neoforge.mods.toml') {
		expand replaceProperties
	}

	exclude 'fabric.mod.json'
	exclude 'wurst.accesswidener'
	exclude 'intentionally_untranslated.json'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 21
}

jar {
	manifest.attributes([
		'MixinConfigs': 'wurst.mixins.json'
	])
	
	from('LICENSE.txt') {
		rename { 'LICENSE-Wurst-Client-NeoForge.txt' }
	}
}

tasks.named('compileTestJava') {
	enabled = false
}

tasks.named('test') {
	enabled = false
}

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			from components.java
		}
	}
}
